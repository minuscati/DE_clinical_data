id: clinical_daily_updates
namespace: clinical
description: "Capture current API records, merge known-cohort observations, then rebuild activity and baseline comparisons."

inputs:
  - id: workspace_dir
    type: STRING
  - id: credential_file
    type: STRING
  - id: project
    type: STRING
    defaults: clinical-trials-learning
  - id: start_date
    type: STRING
    defaults: "2026-10-13"
  - id: end_date
    type: STRING
    defaults: "2026-10-13"

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: fetch_updates
    type: io.kestra.plugin.scripts.python.Commands
    containerImage: clinical-batch:v1
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      entryPoint: [""]
      volumes:
        - "{{ inputs.workspace_dir }}/data:/app/data"
    commands:
      - >-
        python /app/src/fetch_trial_updates.py
        --start-date "{{ inputs.start_date }}"
        --end-date "{{ inputs.end_date }}"
        --run-id "{{ execution.id }}"

  - id: merge_observations
    type: io.kestra.plugin.scripts.python.Commands
    containerImage: clinical-batch:v1
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      entryPoint: [""]
      volumes:
        - "{{ inputs.workspace_dir }}/data:/app/data"
        - "{{ inputs.credential_file }}:/root/.config/gcloud/application_default_credentials.json:ro"
    commands:
      - >-
        python /app/src/load_api_observations.py
        --project "{{ inputs.project }}"
        --run-dir "/app/data/raw/ctgov_updates/{{ inputs.start_date }}_{{ inputs.end_date }}/{{ execution.id }}"

  - id: dbt_api_models
    type: io.kestra.plugin.scripts.python.Commands
    containerImage: clinical-batch:v1
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      entryPoint: [""]
      volumes:
        - "{{ inputs.workspace_dir }}/config/profiles.yml:/app/config/profiles.yml:ro"
        - "{{ inputs.credential_file }}:/root/.config/gcloud/application_default_credentials.json:ro"
        - "{{ inputs.workspace_dir }}/logs/dbt:/app/dbt/logs"
        - "{{ inputs.workspace_dir }}/data/dbt_target:/app/dbt/target"
    commands:
      - dbt build --project-dir /app/dbt --profiles-dir /app/config --select +mart_trial_status_comparison +agg_daily_trial_activity

triggers:
  - id: daily_api
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 8 * * *"
    timezone: Europe/Stockholm
    recoverMissedSchedules: NONE
    inputs:
      workspace_dir: "REPLACE_WITH_CODESPACES_REPOSITORY_PATH"
      credential_file: "REPLACE_WITH_ADC_FILE_PATH"
      project: clinical-trials-learning
      start_date: "{{ trigger.date | dateAdd(-3, 'DAYS') | date('yyyy-MM-dd', timeZone='Europe/Stockholm') }}"
      end_date: "{{ trigger.date | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd', timeZone='Europe/Stockholm') }}"
