version: 2
models:
  - name: stg_api_trial_observations
    description: "Distinct captured API content versions, excluding only derivedSection.miscInfoModule.versionHolder from identity. Full representative JSON is preserved; all captures remain in local raw files and pre-migration versions remain in the legacy table. observed_at is first capture completion time; last_seen_at advances on matching captures. No claim of complete source history."
    columns:
      - name: observation_id
        data_tests: [unique, not_null]
      - name: nct_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_breast_studies')
                field: nct_id
      - name: last_update_posted_date
        data_tests: [not_null]
  - name: mart_trial_status_comparison
    description: "Latest captured status versus the currently loaded AACT baseline. Differences are observed between records, not dated state-transition events. Null flags denote incomparable or older API records."
    columns:
      - name: nct_id
        data_tests: [unique, not_null]
  - name: agg_daily_trial_activity
    description: "Captured existing-cohort trial updates grouped by source posting date. Counts unique trial IDs, not capture runs or registrations. Missing dates do not establish zero activity."
    columns:
      - name: activity_date
        data_tests: [unique, not_null]
      - name: updated_trials
        data_tests: [not_null]
